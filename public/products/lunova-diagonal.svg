<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="Lunova DIAGONAL">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f3e8"/>
      <stop offset="1" stop-color="#e7e1d6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd7cc"/>
      <stop offset="1" stop-color="#d1cbc0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfcdb2"/>
      <stop offset="1" stop-color="#b4a287"/>
    </linearGradient>
    <clipPath id="hbclip"><rect x="430" y="250" width="640" height="360" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#wall)"/>
  <rect width="1500" height="700" fill="url(#glow)"/>
  <rect y="700" width="1500" height="300" fill="url(#floor)"/>

  <!-- headboard -->
  <rect x="430" y="250" width="640" height="360" rx="14" fill="url(#frame)"/>
  <line x1="3.3333333333333144" y1="610" x2="363.3333333333333" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="110" y1="610" x2="470" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="216.66666666666666" y1="610" x2="576.6666666666666" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="323.3333333333333" y1="610" x2="683.3333333333333" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="430" y1="610" x2="790" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="536.6666666666666" y1="610" x2="896.6666666666666" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="643.3333333333334" y1="610" x2="1003.3333333333334" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="750" y1="610" x2="1110" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="856.6666666666667" y1="610" x2="1216.6666666666667" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="963.3333333333334" y1="610" x2="1323.3333333333335" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="1070" y1="610" x2="1430" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="1176.6666666666665" y1="610" x2="1536.6666666666665" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="1283.3333333333335" y1="610" x2="1643.3333333333335" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>
<line x1="1390" y1="610" x2="1750" y2="250" stroke="#a08e73" stroke-width="2.5" stroke-opacity="0.55" clip-path="url(#hbclip)"/>

  <!-- base / bed frame -->
  <rect x="360" y="560" width="820" height="180" rx="16" fill="url(#frame)"/>
  <rect x="360" y="720" width="40" height="60" fill="#b4a287"/>
  <rect x="1140" y="720" width="40" height="60" fill="#b4a287"/>

  <!-- mattress -->
  <rect x="392" y="470" width="756" height="120" rx="14" fill="#FBF8F1"/>
  <rect x="392" y="470" width="756" height="120" rx="14" fill="none" stroke="#7A975F" stroke-width="4"/>
  <g stroke="#E8E2D2" stroke-width="2">
    <line x1="410" y1="478" x2="410" y2="582"/><line x1="490" y1="478" x2="490" y2="582"/><line x1="570" y1="478" x2="570" y2="582"/><line x1="650" y1="478" x2="650" y2="582"/><line x1="730" y1="478" x2="730" y2="582"/><line x1="810" y1="478" x2="810" y2="582"/><line x1="890" y1="478" x2="890" y2="582"/><line x1="970" y1="478" x2="970" y2="582"/><line x1="1050" y1="478" x2="1050" y2="582"/>
    <line x1="392" y1="512" x2="1148" y2="512"/>
    <line x1="392" y1="548" x2="1148" y2="548"/>
  </g>

  <!-- pillows -->
  <rect x="470" y="430" width="180" height="90" rx="22" fill="#e6d4b9"/>
  <rect x="640" y="440" width="150" height="80" rx="20" fill="#f5e3c8"/>

  <!-- brand mark -->
  <text x="80" y="900" font-family="Georgia, serif" font-size="46" letter-spacing="14" fill="#a9a398">LUNOVA</text>
  <text x="84" y="942" font-family="Arial, sans-serif" font-size="22" letter-spacing="10" fill="#b8b2a7">DIAGONAL</text>
</svg>