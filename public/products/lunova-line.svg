<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="Lunova LINE">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ec"/>
      <stop offset="1" stop-color="#e2dfda"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d5d0"/>
      <stop offset="1" stop-color="#ccc9c4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#acb2b6"/>
      <stop offset="1" stop-color="#81878b"/>
    </linearGradient>
    <clipPath id="hbclip"><rect x="430" y="250" width="640" height="360" rx="14"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="1000" fill="url(#wall)"/>
  <rect width="1500" height="700" fill="url(#glow)"/>
  <rect y="700" width="1500" height="300" fill="url(#floor)"/>

  <!-- headboard -->
  <rect x="430" y="250" width="640" height="360" rx="14" fill="url(#frame)"/>
  <line x1="501.1111111111111" y1="264" x2="501.1111111111111" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="572.2222222222222" y1="264" x2="572.2222222222222" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="643.3333333333334" y1="264" x2="643.3333333333334" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="714.4444444444445" y1="264" x2="714.4444444444445" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="785.5555555555555" y1="264" x2="785.5555555555555" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="856.6666666666667" y1="264" x2="856.6666666666667" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="927.7777777777778" y1="264" x2="927.7777777777778" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>
<line x1="998.8888888888889" y1="264" x2="998.8888888888889" y2="596" stroke="#6d7377" stroke-width="2.5" stroke-opacity="0.55"/>

  <!-- base / bed frame -->
  <rect x="360" y="560" width="820" height="180" rx="16" fill="url(#frame)"/>
  <rect x="360" y="720" width="40" height="60" fill="#81878b"/>
  <rect x="1140" y="720" width="40" height="60" fill="#81878b"/>

  <!-- mattress -->
  <rect x="392" y="470" width="756" height="120" rx="14" fill="#FBF8F1"/>
  <rect x="392" y="470" width="756" height="120" rx="14" fill="none" stroke="#7A975F" stroke-width="4"/>
  <g stroke="#E8E2D2" stroke-width="2">
    <line x1="410" y1="478" x2="410" y2="582"/><line x1="490" y1="478" x2="490" y2="582"/><line x1="570" y1="478" x2="570" y2="582"/><line x1="650" y1="478" x2="650" y2="582"/><line x1="730" y1="478" x2="730" y2="582"/><line x1="810" y1="478" x2="810" y2="582"/><line x1="890" y1="478" x2="890" y2="582"/><line x1="970" y1="478" x2="970" y2="582"/><line x1="1050" y1="478" x2="1050" y2="582"/>
    <line x1="392" y1="512" x2="1148" y2="512"/>
    <line x1="392" y1="548" x2="1148" y2="548"/>
  </g>

  <!-- pillows -->
  <rect x="470" y="430" width="180" height="90" rx="22" fill="#b3b9bd"/>
  <rect x="640" y="440" width="150" height="80" rx="20" fill="#c2c8cc"/>

  <!-- brand mark -->
  <text x="80" y="900" font-family="Georgia, serif" font-size="46" letter-spacing="14" fill="#a4a19c">LUNOVA</text>
  <text x="84" y="942" font-family="Arial, sans-serif" font-size="22" letter-spacing="10" fill="#b3b0ab">LINE</text>
</svg>